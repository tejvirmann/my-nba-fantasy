<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Account + appearance · CLEAN</title>
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="../assets/refined.css"></head>
<body class="theme-clean refined"><header class="hdr"><span class="logo">HL</span><div class="ttl">Hoops League</div></header><main><div class="page" style="max-width:640px"><div class="pad stack"><div><b style="font-size:20px">Account</b><div style="font-size:13px;color:var(--mut)">Tejvir · Admin</div></div>
   <div class="card"><div class="sec"><span>Appearance</span></div><div class="pad stack"><div style="font-size:14px;color:var(--mut)">Pick the accent color used for the header, tabs, and buttons. It's saved to your account.</div>
     <div class="swatches"><button class="sw" data-hex="#0c8312" style="background:#0c8312" aria-label="#0c8312"></button><button class="sw" data-hex="#166534" style="background:#166534" aria-label="#166534"></button><button class="sw" data-hex="#059669" style="background:#059669" aria-label="#059669"></button><button class="sw" data-hex="#0f766e" style="background:#0f766e" aria-label="#0f766e"></button><button class="sw" data-hex="#1d4ed8" style="background:#1d4ed8" aria-label="#1d4ed8"></button><button class="sw" data-hex="#6d28d9" style="background:#6d28d9" aria-label="#6d28d9"></button><button class="sw" data-hex="#c2410c" style="background:#c2410c" aria-label="#c2410c"></button><button class="sw" data-hex="#c8102e" style="background:#c8102e" aria-label="#c8102e"></button><button class="sw" data-hex="#334155" style="background:#334155" aria-label="#334155"></button></div>
     <label class="row" style="gap:12px"><span style="font-size:13px;font-weight:700">Custom</span><input type="color" value="#0c8312" style="width:56px;height:36px;border:1px solid #c9cdd3;border-radius:6px;background:#fff"></label>
     <div class="row"><button class="pill solid">Save color</button><button class="pill" data-hex="#0c8312">Reset to default green</button></div>
     <div class="banner" style="font-size:13px">Live preview: this whole page, and every other mockup, already uses your pick.</div></div></div>
   <div class="card"><div class="sec"><span>Change password</span></div><div class="pad stack"><input class="input" type="password" placeholder="New password (8+ characters)"><input class="input" type="password" placeholder="Confirm new password"><button class="pill solid block">Update password</button></div></div>
   <div class="row"><button class="pill grow">Install on your phone</button><button class="pill grow">Log out</button></div></div></div></main><script src="../assets/accent.js"></script></body></html>
